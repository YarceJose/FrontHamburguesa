<main class="page">
  <div class="shape shape--yellow" aria-hidden="true"></div>
  <div class="shape shape--red" aria-hidden="true"></div>

  <section class="card">
    <a class="brand" routerLink="/"><img [src]="brand.logo" alt="" /> {{ brand.name }}</a>
    <header class="panel-head">
      <p class="eyebrow">Personal</p>
      <h1 class="panel-head__title">Cocina y domicilios</h1>
      <p class="panel-head__subtitle">Ingresa con el usuario que te dio el administrador.</p>
    </header>

    @if (notice(); as message) { <p class="alert alert--info">{{ message }}</p> }

    <app-login-form [allowedRoles]="['Cook', 'Delivery']" wrongRoleMessage="El administrador ingresa desde la página principal." />
  </section>
</main>
